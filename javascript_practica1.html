<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

  <body>

                    <option value="1">sumar</option>
                    <option value="2">restar</option>
                    <option value="3">multiplicar</option>
                    <option value="4">dividir</option>

                  <form>
                    <div class="mb-3">
                      <label for="numeros1" class="form-label">numero1</label>
                      <input type="text" id="num1" class="from-control">
                    </div>
                    <div class="mb-3">
                      <label for="numeros2" class="form-label">numero2</label>
                      <input type="text" id="num2" class="from-control">
                    </div>
                    <button type="button" onclick="operar()">operar</button>
                  </form>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</html>
